# Ejemplo de reglas Nginx para kdl.com.mx (dentro del bloque server).
# URLs anteriores -> URLs limpias (301)
location = /index.html { return 301 /; }
location ~ ^/Productos\.dc(\.html)?$ { if ($request_uri !~ "^/catalogo") { return 301 /catalogo$is_args$args; } }
location = /catalogo                 { try_files /Productos.dc.html =404; }
location = /producto                 { try_files /Producto.dc.html =404; }
location = /mi-cotizacion            { try_files /Cesta.dc.html =404; }
location = /contacto                 { try_files /Contacto.dc.html =404; }
location = /como-te-ayudamos         { try_files /Soluciones.dc.html =404; }
location = /descargas                { try_files /Catalogos.dc.html =404; }
location = /alternativas-compatibles { try_files /Compatibilidad.dc.html =404; }
location = /marcas                   { try_files /Marcas.dc.html =404; }
location = /checklists               { try_files /Checklists.html =404; }
location = /guias                    { try_files /Guias.html =404; }
location = /aviso-de-privacidad      { try_files /Aviso-Privacidad.html =404; }
# Repite el patrón de 301 de la primera regla para Producto, Cesta, Contacto, Soluciones,
# Catalogos, Compatibilidad, Marcas, Checklists, Guias y Aviso-Privacidad (ver vercel.json).
location / { try_files $uri $uri/index.html =404; }
